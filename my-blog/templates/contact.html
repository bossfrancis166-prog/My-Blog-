{% extends "base.html" %}

{% block content %}

<section class="contact-section">
    <h2 class="section-title">Get In Touch</h2>
    <p class="contact-intro">Have a thought, story idea or just want to say hello? I'd love to hear from you!</p>

    <div class="contact-form">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="What's this about?">
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="6" placeholder="Write your message here..."></textarea>
        </div>

        <button class="submit-btn">Send Message</button>
    </div>
</section>

{% endblock %}
