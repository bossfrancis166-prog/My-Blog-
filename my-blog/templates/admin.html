{% extends "base.html" %}

{% block content %}

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<section class="admin-section">
    <h2 class="section-title">Write a New Post</h2>
    <p class="contact-intro">Fill in the details below and hit publish — your post goes live instantly!</p>

    <div class="admin-form">
        <form method="POST" action="/admin" id="admin-form" enctype="multipart/form-data">

            <div class="form-group">
                <label for="title">Post Title</label>
                <input type="text" id="title" name="title" placeholder="Enter your post title..." required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a category...</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="cover_image">Cover Image</label>
                <div class="cover-upload-area" onclick="document.getElementById('cover_image').click()">
                    <div id="cover-placeholder">
                        <span class="upload-icon">🖼️</span>
                        <p>Click to upload cover image</p>
                        <small>PNG, JPG, GIF, WEBP supported</small>
                    </div>
                    <img id="cover-preview" src="" alt="Cover preview" style="display:none; width:100%; max-height:300px; object-fit:cover; border-radius:6px;">
                </div>
                <input type="file" id="cover_image" name="cover_image" accept="image/*" style="display:none;" onchange="previewCover(this)">
            </div>

            <div class="form-group">
                <label>Your Article</label>
                <div id="editor-container">
                    <div id="editor"></div>
                </div>
                <input type="hidden" name="content" id="content">
            </div>

            <div class="admin-actions">
                <button type="button" class="submit-btn" onclick="submitForm()">Publish Post →</button>
                <a href="/" class="cancel-btn">Cancel</a>
            </div>

        </form>
    </div>
</section>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Write your story here...',
        modules: {
            toolbar: [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                ['blockquote'],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                ['link', 'image'],
                ['clean']
            ]
        }
    });

    var toolbar = quill.getModule('toolbar');
    toolbar.addHandler('image', function() {
        var input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', 'image/*');
        input.click();
        input.onchange = function() {
            var file = input.files[0];
            var formData = new FormData();
            formData.append('image', file);
            fetch('/upload-image', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.url) {
                    var range = quill.getSelection();
                    quill.insertEmbed(range.index, 'image', window.location.origin + data.url);
                }
            });
        };
    });

    function previewCover(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('cover-preview').src = e.target.result;
                document.getElementById('cover-preview').style.display = 'block';
                document.getElementById('cover-placeholder').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function submitForm() {
        document.getElementById('content').value = quill.root.innerHTML;
        document.getElementById('admin-form').submit();
    }
</script>

{% endblock %}
